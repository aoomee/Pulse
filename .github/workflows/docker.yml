name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.3)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Client builds only require Go 1.15, but we use 1.22 to match
          # the server toolchain and allow rebuilding anything in-repo.
          go-version: '1.22'

      - name: Build Client Binaries
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} makes the server hold up under very large agent counts and adds per-system homepage visibility controls, while keeping existing clients and databases compatible.

            ### Highlights

            - Geo-IP lookups no longer run on the push/poll request path. A cache miss queues a background job (fixed worker pool, bounded queue, one in-flight lookup per IP) and the persisted location is reused while the public IP is unchanged. Previously, with the lookup services slow or blocked, 100 agents could drive the server to thousands of goroutines and zero successful pushes for minutes after every restart.
            - SSE hardening: per-write deadlines so half-open viewers cannot pin a goroutine forever; configurable stream caps (`SSE_MAX_STREAMS`, `SSE_MAX_STREAMS_PER_IP`) that never apply to admin sessions; snapshots are streamed without per-subscriber copies and new subscribers reuse the broadcaster's latest payload.
            - TCPing batches keep the agent's real measurement timestamps (outages show as gaps instead of a burst of fake points), clock skew is corrected from the newest sample, re-sent batches are idempotent, and the per-target "latest" value can no longer be frozen by a future-dated record.
            - Agent writes merge admin-owned fields (name, tags, order, secret, visibility toggles) inside the write transaction, so a concurrent admin edit is never reverted by a push or poll.
            - Push-mode online threshold raised from 10 s to 15 s to avoid offline flicker on high-latency links.
            - New per-system admin toggles in the edit dialog: "Show on homepage" and "Show TCPing" (both default on). Hidden systems remain in the API and the admin page.
            - Static path hardening: traversal probes such as `/../admin` no longer resolve to a page.
            - Admin actions stay fast on large databases: reordering is one transaction, deleting a system or a TCPing target removes its history in the background in bounded chunks (no more multi-second stalls of the admin page or of agent pushes).
            - Proxy handling: `X-Forwarded-For` is now read from the trusted side of the chain, so a client behind a CDN listed in `TRUSTED_PROXIES` can no longer spoof its address to bypass the login rate limit or the per-IP SSE cap. The client lets the HTTP transport negotiate compression, so registration responses gzipped by a CDN are decoded correctly.
            - `docker-compose.yaml` sets a 45 s stop grace period so the database always closes cleanly.
            - Client: constant-time secret comparison.

            Load-tested at 1000 push agents (each sending TCPing results every 3 s) on an emulated 1-core box: about 25% CPU, about 30 MB RSS, zero failed pushes.

            ### Compatibility

            - Existing clients continue to work; the new visibility fields are optional and ignored by older agents.
            - Existing `metrics.db` files remain readable, including legacy TCPing key formats.
            - Existing Docker named-volume and bind-mount deployments are supported.
            - Behind a reverse proxy or CDN that is not listed in `TRUSTED_PROXIES`, all viewers share the proxy address for rate limits and SSE caps; set `TRUSTED_PROXIES` or raise `SSE_MAX_STREAMS_PER_IP`.

            ### Verified

            - Server vet, race-enabled tests (22 tests) and build.
            - Client vet and build.
            - Frontend Astro build.
            - Load tests at 100, 300, 500 and 1000 simulated agents, including a mid-run server restart.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8080
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
