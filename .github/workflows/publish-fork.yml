name: Publish Pulse Fork

on:
  push:
    tags: ['v*-vnstat.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.4.0-vnstat.2)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/aoomee/pulse

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: server/web
        run: npm ci && npm run build
      - name: Test Go and installer
        run: |
          bash -n client/install.sh
          (cd client && go test ./... && go vet ./...)
          (cd server && go test -race ./... && go vet ./...)
      - name: Build release binaries
        run: |
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            case "$target" in
              linux/amd64) name=probe-client ;;
              linux/arm64) name=probe-client-arm64 ;;
              darwin/*) name=probe-client-darwin-$arch ;;
              windows/amd64) name=probe-client.exe ;;
            esac
            (cd client && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags='-s -w' -o "../release/$name" .)
          done
          for arch in amd64 arm64; do
            (cd server && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -ldflags='-s -w' -o "../release/pulse-server-standalone-linux-$arch" .)
          done
          cp client/install.sh client/install.ps1 docker-compose.yaml release/
          (cd release && sha256sum * > SHA256SUMS)
      - name: Browser regression tests
        run: |
          npm install --prefix "$RUNNER_TEMP/pulse-browser" playwright@1.62.1
          "$RUNNER_TEMP/pulse-browser/node_modules/.bin/playwright" install --with-deps chromium
          export PULSE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/pulse-browser/node_modules/playwright"
          PORT=18080 DB_PATH="$RUNNER_TEMP/pulse-browser/test.db" ./release/pulse-server-standalone-linux-amd64 > "$RUNNER_TEMP/pulse-browser/server.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"; cat "$RUNNER_TEMP/pulse-browser/server.log"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          node server/web/tests/admin-install.cjs
          node server/web/tests/dashboard-motion.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/*

  image:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test published amd64 container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name pulse-smoke -p 127.0.0.1:18080:8008 "$IMAGE:$VERSION"
          trap 'docker logs pulse-smoke; docker rm -f pulse-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ -o /tmp/pulse-home.html
          grep -q 'id="monitor-root"' /tmp/pulse-home.html
          curl -fsS http://127.0.0.1:18080/admin/ -o /tmp/pulse-admin.html
          grep -q "$RELEASE_TAG/install.sh" /tmp/pulse-admin.html

  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Pulse ${{ env.RELEASE_TAG }}
          prerelease: true
          files: release/*
          body: |
            ## vnStat monthly traffic + refined dashboard
            - Optional Linux vnStat billing cycles and per-machine monthly allowances.
            - Compact aligned meters with usage/allowance inside, and gentle one-time entry animation.
            - Matching clients and installation scripts are pinned to this release, not upstream binaries.
            - Fix Linux command copying, with selectable preview, root/sudo choice and HTTP fallback.
            - Align newly added host names with the edit icon when no OS information exists.
            - Tests: Go tests/vet (server race tests), frontend build, browser clipboard/layout/motion regression, and published amd64 container smoke test.

            Image (linux/amd64 and linux/arm64): `ghcr.io/aoomee/pulse:1.4.0-vnstat.2`
            Use the attached `docker-compose.yaml`, then run `docker compose up -d` and open port 8008.
            Persist `/app/data`; back up existing data before upgrading. This is a prerelease for deployment testing.
            vnStat starts counting when installed; previous usage cannot be recovered. Monthly usage is RX + TX.
